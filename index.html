<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="quiz.css">
</head>

<body>
    <div class="app">
        <h1>Simple Quiz</h1>

        <!-- Name Input Screen -->
        <div id="start-screen">
            <input type="text" id="username" placeholder="Enter your name">
            <p id="error" style="color:red; visibility:hidden; height:18px;">
                Please enter your name
            </p>
            <button id="start-btn">Start Quiz</button>
        </div>

        <!-- Quiz Section -->
        <div class="quiz" id="quiz-container" style="display:none;">
            <div class="quiz-progress-container">
                <div class="quiz-progress-bar" id="quiz-progress-bar"></div>
            </div>
            <p id="question-tracker" class="question-tracker"></p>
            <h2 id="question">Question goes here</h2>
            <div id="answer-buttons"></div>
            <button id="next-btn">Next</button>
        </div>

        <!-- Result -->
        <div id="result" style="display:none;"></div>

        <!-- History -->
        <div id="history" style="display: none;">
            <h3 style="text-align:center;">📊 Quiz History</h3>
            <table class="history-table" id="history-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Score</th>
                        <th>Date & Time</th>
                    </tr>
                </thead>
                <tbody id="history-body"></tbody>
            </table>
            <p id="empty-history-msg" style="display: none; text-align: center; color: #666; margin: 15px 0; font-size: 14px;">No quiz history available.</p>
            <div style="text-align: center; margin-top: 15px;">
                <button id="clear-history-btn">Clear History</button>
            </div>
        </div>
    </div>
    <script src="quiz.js"></script>
</body>

</html>
